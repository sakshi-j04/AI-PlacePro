<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Sign Up - AI PlacePro</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-brand">
                <h2>🏢 AI PlacePro for Companies</h2>
                <p>Join as a partner company and list your job requirements</p>
            </div>
            <div class="auth-stats">
                <div class="stat-box">
                    <h3>500+</h3>
                    <p>Partner Companies</p>
                </div>
                <div class="stat-box">
                    <h3>50,000+</h3>
                    <p>Students Trained</p>
                </div>
                <div class="stat-box">
                    <h3>95%</h3>
                    <p>Placement Success</p>
                </div>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-box">
                <h1>Register Your Company</h1>
                <p class="auth-subtitle">Create your company account</p>
                
                <form id="companySignupForm" onsubmit="handleCompanySignup(event)">
                    <div class="form-group">
                        <label for="companyName">Company Name</label>
                        <input type="text" id="companyName" placeholder="Acme Tech Pvt Ltd" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Company Email</label>
                        <input type="email" id="email" placeholder="hr@company.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Contact Number</label>
                        <input type="tel" id="phone" placeholder="+91 9876543210" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="industry">Industry</label>
                        <input type="text" id="industry" placeholder="IT / Software / Fintech" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create a strong password" required minlength="6">
                        <small class="password-hint">Minimum 6 characters</small>
                    </div>
                    
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" required>
                            <span>I agree to the <a href="#">Terms & Conditions</a></span>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn-submit">Create Company Account</button>
                </form>
                
                <div class="auth-footer">
                    <p>Already have an account? <a href="company-login.html">Sign In</a></p>
                </div>
                
                <div class="auth-footer" style="margin-top: 1rem;">
                    <p><a href="signup.html">← Back to Student Sign Up</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../js/api.js"></script>
    <script src="../js/company-auth.js"></script>
</body>
</html>
