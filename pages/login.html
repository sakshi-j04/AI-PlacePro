<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AI PlacePro</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-brand">
                <h2>🎓 AI PlacePro</h2>
                <p>Welcome back! Continue your placement journey</p>
            </div>
            <div class="auth-features">
                <div class="feature-item">
                    <span class="feature-icon">✨</span>
                    <p>Personalized AI training roadmap</p>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">📊</span>
                    <p>Track your progress in real-time</p>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">🎯</span>
                    <p>Get placement ready faster</p>
                </div>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-box">
                <h1>Sign In</h1>
                <p class="auth-subtitle">Access your personalized dashboard</p>
                
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="your.email@example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="btn-submit">Sign In</button>
                </form>
                
                <div class="auth-footer">
                    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                    <p style="margin-top:0.75rem;">
                        <button type="button" class="btn-secondary" onclick="window.location.href='../index.html'">
                            ← Back to landing page
                        </button>
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
