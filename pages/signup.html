<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI PlacePro</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-brand">
                <h2>🎓 AI PlacePro</h2>
                <p>Start your AI-powered placement training journey today</p>
            </div>
            <div class="auth-stats">
                <div class="stat-box">
                    <h3>50,000+</h3>
                    <p>Students Trained</p>
                </div>
                <div class="stat-box">
                    <h3>95%</h3>
                    <p>Success Rate</p>
                </div>
                <div class="stat-box">
                    <h3>500+</h3>
                    <p>Partner Companies</p>
                </div>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-box">
                <h1>Create Account</h1>
                <p class="auth-subtitle">Get started with your free account</p>
                
                <form id="signupForm" onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="John Doe" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="your.email@example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="+91 9876543210" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="college">College/University</label>
                        <input type="text" id="college" placeholder="Your institution name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create a strong password" required minlength="6">
                        <small class="password-hint">Minimum 6 characters</small>
                    </div>
                    
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" required>
                            <span>I agree to the <a href="#">Terms & Conditions</a></span>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn-submit">Create Account</button>
                </form>
                
                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
